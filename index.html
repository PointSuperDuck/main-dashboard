<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบติดตามผลการดำเนินงาน - สำนักงานชลประทานที่ 11</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Sarabun', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      overflow: hidden;
    }

    /* 🌊 แถบ Header หลัก (สีน้ำเงินชลประทาน) */
    .main-header {
      background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
      color: #ffffff;
      padding: 12px 20px;
      box-shadow: 0 4px 12px rgba(13, 71, 161, 0.25);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .header-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
    }

    /* ปุ่มกดสลับเมนู */
    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      padding: 7px 16px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Sarabun', sans-serif;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }

    .tab-btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .tab-btn.active {
      background-color: #ffffff;
      color: #0d47a1;
      border-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* กล่องครอบ iframe ทั้งหมด */
    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* ซ้อน iframe ทั้ง 3 ตัวไว้ในตำแหน่งเดียวกัน */
    .dashboard-frame {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
    }

    /* แสดงเฉพาะ iframe ตัวที่เลือก */
    .dashboard-frame.active {
      display: block;
    }

    /* แถบ Footer แสดงผู้จัดทำ */
    .main-footer {
      text-align: center;
      padding: 6px 12px;
      background-color: #ffffff;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #475569;
      flex-shrink: 0;
    }

    /* 📱 การปรับแต่งบนหน้าจอมือถือ */
    @media (max-width: 768px) {
      .main-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 10px 12px;
        gap: 8px;
      }

      .header-title {
        font-size: 1.05rem;
      }

      .nav-tabs {
        width: 100%;
        justify-content: center;
        overflow-x: auto;
        white-space: nowrap;
        padding-bottom: 2px;
      }

      .tab-btn {
        padding: 6px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="main-header">
    <h1 class="header-title">🌊 ระบบติดตามและรายงานผลการดำเนินงาน สำนักงานชลประทานที่ 11</h1>
    
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('overview', this)">📌 ภาพรวม</button>
      <button class="tab-btn" onclick="switchTab('urgent', this)">🚀 รายการเร่งรัด</button>
      <button class="tab-btn" onclick="switchTab('step', this)">📋 สรุปขั้นตอนจัดซื้อ/จัดจ้าง</button>
    </div>
  </div>

  <div class="iframe-container">
    <iframe id="frame-overview" class="dashboard-frame active" src="https://pointsuperduck.github.io/DashAllRio11/?v=1.1"></iframe>
    <iframe id="frame-urgent" class="dashboard-frame" src="https://pointsuperduck.github.io/dashboard--11/?v=1.1"></iframe>
    <iframe id="frame-step" class="dashboard-frame" src="https://pointsuperduck.github.io/DashAllRio11/step_summary.html?v=1.1"></iframe>
  </div>

  <div class="main-footer">
    💡 <strong>จัดทำโดย:</strong> ฝ่ายติดตามและประเมินผล ส่วนแผนงาน สำนักงานชลประทานที่ 11
  </div>

  <script>
    function switchTab(type, btnElement) {
      // 1. ซ่อน iframe ทั้งหมด
      document.querySelectorAll('.dashboard-frame').forEach(frame => {
        frame.classList.remove('active');
      });

      // 2. แสดง iframe ตัวที่เลือก
      const activeFrame = document.getElementById('frame-' + type);
      if (activeFrame) {
        activeFrame.classList.add('active');
      }

      // 3. เปลี่ยนสถานะปุ่มกด
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>
</body>
</html>
